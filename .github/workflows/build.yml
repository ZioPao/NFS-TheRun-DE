name: Build ASI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/**.cpp'
      - 'src/**.h'
      - 'build.bat'
      - 'CMakeLists.txt'
      - '.github/workflows/build.yml'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MINGW32
          update: true
          install: mingw-w64-i686-gcc
          suppress-deprecation-warnings: msystem-mingw32

      - name: Build
        shell: cmd
        env:
          TOOLCHAIN: ${{ steps.msys2.outputs.msys2-location }}\mingw32\bin
        run: |
          set "GXX=%TOOLCHAIN%\g++.exe"
          set "PATH=%TOOLCHAIN%;%PATH%"
          build.bat

      - uses: actions/upload-artifact@v7
        with:
          name: NFSTR_DefinitiveEdition
          path: |
            NFSTR_DefinitiveEdition.asi
            NFSTR_DefinitiveEdition.ini
